<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linktomp3</title>
  <meta name="theme-color" content="#e0312b">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <style>
    :root {
      --bg: #f4f4f6; --card: #ffffff; --text: #1c1c22; --muted: #6b6b76;
      --accent: #e0312b; --accent-hover: #c2241f; --border: #dcdce2;
      --ok: #1f8a4c; --err: #c0262d; --track: #ececf0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121216; --card: #1d1d23; --text: #ececf1; --muted: #9c9ca8;
        --border: #34343d; --track: #2a2a31; --ok: #43c47a; --err: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    main {
      width: 100%; max-width: 560px; background: var(--card);
      border: 1px solid var(--border); border-radius: 14px; padding: 28px;
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p.lead { margin: 0 0 22px; color: var(--muted); }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: .9rem; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    input[type=url], select {
      font: inherit; color: inherit; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    }
    input[type=url] { flex: 1 1 260px; min-width: 0; }
    input[type=url], select, button, a.btn { min-height: 48px; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: var(--bg); }
    @media (max-width: 480px) {
      body { place-items: start center; padding-top: 24px; }
      main { padding: 22px 18px; }
      .row > button { flex: 1 1 0; }
      input[type=url] { flex-basis: 100%; font-size: 16px; }
      a.btn { width: 100%; text-align: center; }
    }
    input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button, a.btn {
      font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 8px;
      padding: 10px 18px; background: var(--accent); color: #fff; text-decoration: none;
      display: inline-block;
    }
    button:hover, a.btn:hover { background: var(--accent-hover); }
    button:disabled { opacity: .55; cursor: progress; }
    .options { margin-top: 14px; display: flex; align-items: center; gap: 10px; }
    .options label { margin: 0; font-weight: 500; }
    #status { margin-top: 22px; display: none; }
    .bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; margin: 8px 0; }
    .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    .bar.indeterminate > div { width: 35%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { margin-left: -35%; } to { margin-left: 100%; } }
    .msg { font-size: .95rem; word-break: break-word; }
    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); font-weight: 600; }
    .done { margin-top: 12px; display: none; }
    footer { margin-top: 24px; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Linktomp3</h1>
  <p class="lead">Liitä YouTube-linkki, niin saat siitä ladattavan mp3-tiedoston.</p>

  <form id="form">
    <label for="url">YouTube-linkki</label>
    <div class="row">
      <input id="url" name="url" type="url" required autocomplete="off"
             placeholder="https://www.youtube.com/watch?v=...">
      <button id="paste" type="button" class="secondary" hidden>Liitä</button>
      <button id="go" type="submit">Muunna</button>
    </div>
    <div class="options">
      <label for="bitrate">Laatu</label>
      <select id="bitrate" name="bitrate">
        {% for b in bitrates %}
        <option value="{{ b }}" {% if b == default %}selected{% endif %}>{{ b }} kbps</option>
        {% endfor %}
      </select>
    </div>
  </form>

  <section id="status" aria-live="polite">
    <div class="msg" id="msg"></div>
    <div class="bar" id="bar"><div></div></div>
    <div class="done" id="done"><a class="btn" id="dl" href="#">Lataa mp3</a></div>
  </section>

  <footer>Lataa vain sisältöä, johon sinulla on oikeus.</footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const form = $("form"), go = $("go"), statusBox = $("status"),
        msg = $("msg"), bar = $("bar"), done = $("done"), dl = $("dl");

  function show(text, cls = "") {
    statusBox.style.display = "block";
    msg.textContent = text;
    msg.className = "msg " + cls;
  }
  function setBar(pct, indeterminate) {
    bar.style.display = pct === null ? "none" : "block";
    bar.classList.toggle("indeterminate", !!indeterminate);
    bar.firstElementChild.style.width = indeterminate ? "" : (pct || 0) + "%";
  }

  async function poll(id) {
    while (true) {
      await new Promise((r) => setTimeout(r, 800));
      let job;
      try {
        const res = await fetch("/api/jobs/" + id);
        job = await res.json();
        if (!res.ok) throw new Error(job.error || "Tuntematon virhe");
      } catch (e) {
        return finish(e.message, "err");
      }
      if (job.status === "queued") { show("Jonossa..."); setBar(0, true); }
      else if (job.status === "downloading") {
        show("Ladataan... " + (job.progress ? job.progress.toFixed(0) + " %" : ""));
        setBar(job.progress, !job.progress);
      } else if (job.status === "converting") { show("Muunnetaan mp3:ksi..."); setBar(100, true); }
      else if (job.status === "error") { return finish(job.error, "err"); }
      else if (job.status === "done") {
        finish("Valmis: " + job.filename, "ok");
        dl.href = "/download/" + id;
        done.style.display = "block";
        window.location.href = dl.href;   // käynnistetään lataus automaattisesti
        return;
      }
    }
  }

  function finish(text, cls) {
    show(text, cls);
    setBar(null);
    go.disabled = false;
  }

  // "Liitä"-painike leikepöydältä (toimii https:llä ja localhostissa, esim. Termux)
  if (navigator.clipboard && navigator.clipboard.readText) {
    $("paste").hidden = false;
    $("paste").addEventListener("click", async () => {
      try {
        const text = (await navigator.clipboard.readText()).trim();
        const m = text.match(/https?:\/\/\S+/);
        $("url").value = m ? m[0] : text;
      } catch (_) {
        $("url").focus();
      }
    });
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    start();
  });

  // Androidin jakotoiminto ohjaa tänne muodossa /?url=... – aloitetaan heti.
  const params = new URLSearchParams(location.search);
  if (params.get("error")) show(params.get("error"), "err");
  if (params.get("url")) {
    $("url").value = params.get("url");
    start();
  }
  if (params.toString()) history.replaceState(null, "", "/");

  async function start() {
    if (!$("url").value.trim()) return $("url").focus();
    go.disabled = true;
    done.style.display = "none";
    show("Haetaan videon tietoja...");
    setBar(0, true);
    try {
      const res = await fetch("/api/jobs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: $("url").value, bitrate: $("bitrate").value }),
      });
      const job = await res.json();
      if (!res.ok) throw new Error(job.error || "Tuntematon virhe");
      poll(job.id);
    } catch (err) {
      finish(err.message, "err");
    }
  }
</script>
</body>
</html>
