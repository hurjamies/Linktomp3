<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e0312b">
  <title>Linktomp3</title>
  <style>
    :root { --bg: #f4f4f6; --card: #fff; --text: #1c1c22; --muted: #6b6b76; --border: #dcdce2; --accent: #e0312b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121216; --card: #1d1d23; --text: #ececf1; --muted: #9c9ca8; --border: #34343d; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
           background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 480px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    code { background: var(--bg); padding: 2px 6px; border-radius: 4px; }
    p.muted { color: var(--muted); font-size: .9rem; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 12px 20px;
             background: var(--accent); color: #fff; width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <h1>Palvelin ei ole käynnissä</h1>
  <p>Avaa <b>Termux</b> ja kirjoita:</p>
  <p><code>linktomp3-web</code></p>
  <p class="muted">Jos asensit Termux:Widgetin, voit käynnistää palvelimen myös kotinäytön pikakuvakkeella.</p>
  <button onclick="location.href='/'">Yritä uudelleen</button>
</main>
</body>
</html>
